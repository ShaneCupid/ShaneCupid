name: Render metrics

on:
  schedule:
    - cron: "43 4 * * *"   # nightly, before update-readme
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - theme: light
            file: assets/metrics-light.svg
          - theme: dark
            file: assets/metrics-dark.svg
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN: classic PAT, scopes read:user + repo (repo only if you
          # want private-contribution counts). Do not reuse PROFILE_TOKEN.
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ShaneCupid
          filename: ${{ matrix.file }}
          committer_message: "chore(metrics): refresh ${{ matrix.theme }}"
          template: classic
          base: header, activity, repositories
          config_timezone: Europe/Berlin
          config_display: large
          # Theme colors are placeholders — set from your v0 palette.
          # Accepts a metrics theme name or "custom" with config_*_colors.
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used, recently-used
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: commit, release, pr
          plugin_stars: no
          plugin_followup: no
